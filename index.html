/* Layout: one dark stage holding the book; a slim title bar on top, a transport bar below, a drawer on the right for thumbnails, contents, search and sharing. */
:root{
  --stage:#1d1e19;      /* olive black, from the cover engraving */
  --bar:#262721;
  --raise:#30322a;
  --fg:#ece6d3;         /* paper */
  --muted:#a29d86;
  --accent:#c8b36a;     /* laurel gold */
  --line:rgba(236,230,211,.13);
  --display:"Bodoni Moda","Bodoni 72","Didot",Georgia,serif;
  --text:"Crimson Pro","Crimson Text",Georgia,"Times New Roman",serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--stage);color:var(--fg);font:17px/1.35 var(--text);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
.app{position:relative;height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr)}
.bar{display:flex;align-items:center;gap:4px;background:var(--bar);padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:46px;box-sizing:border-box}
.top{border-bottom:1px solid var(--line)}
.bottom{border-top:1px solid var(--line)}
.title{flex:1;min-width:0;font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title small{font-family:var(--text);font-weight:400;color:var(--muted);font-size:15px;margin-left:10px;letter-spacing:.04em}
.ib{display:inline-grid;place-items:center;width:38px;height:38px;border:0;background:none;border-radius:6px;cursor:pointer;color:var(--fg);flex:none}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ib:hover{background:var(--raise)}
.ib[aria-pressed="true"]{color:var(--accent);background:var(--raise)}
.ib:disabled{opacity:.35;cursor:default;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px;flex:none}

.stage{position:relative;min-height:0;overflow:hidden}
.bookwrap{position:absolute;inset:22px 64px}
#book{width:100%;height:100%}
.page{background:#fff}
.page.blank{background:#f3f1ea}
.page img{display:block;width:100%;height:100%;object-fit:fill;user-select:none;-webkit-user-drag:none;pointer-events:none}
.page img:not([src]){visibility:hidden}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:84px;border:0;border-radius:6px;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center;z-index:5}
.nav:hover{color:var(--fg);background:rgba(255,255,255,.05)}
.nav svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.5}
.nav.prev{left:8px}.nav.next{right:8px}
.nav:disabled{opacity:0;pointer-events:none}

.counter{font-variant-numeric:tabular-nums;min-width:118px;text-align:center;color:var(--fg);font-size:16px;white-space:nowrap;cursor:pointer;border:0;background:none;padding:6px 8px;border-radius:6px}
.counter:hover{background:var(--raise)}
.counter span{color:var(--muted)}
.slider{flex:1;min-width:60px;position:relative;display:flex;align-items:center;padding:0 8px}
#range{width:100%;accent-color:var(--accent);height:24px;cursor:pointer}
.tip{position:absolute;bottom:34px;transform:translateX(-50%);background:var(--fg);color:var(--stage);font-size:14px;padding:2px 8px;border-radius:4px;white-space:nowrap;pointer-events:none;font-variant-numeric:tabular-nums}
.goto{display:flex;align-items:center;gap:6px;font-size:15px;color:var(--muted)}
.goto input{width:64px;background:var(--stage);border:1px solid var(--line);color:var(--fg);font:inherit;padding:5px 7px;border-radius:5px;font-variant-numeric:tabular-nums}

/* drawer */
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(360px,100%);background:var(--bar);border-left:1px solid var(--line);z-index:20;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s ease;box-shadow:-12px 0 30px rgba(0,0,0,.35)}
.drawer.open{transform:none}
.dhead{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 18px;border-bottom:1px solid var(--line)}
.dhead h2{flex:1;margin:0;font:600 19px var(--display);letter-spacing:.01em}
.dbody{flex:1;overflow:auto;padding:14px 16px 24px;overscroll-behavior:contain}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:14px 10px}
.th{border:0;background:none;padding:0;cursor:pointer;text-align:center;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.th i{display:block;aspect-ratio:1630/1559;background-color:#fff;background-repeat:no-repeat;background-size:1000% auto;border:2px solid transparent;border-radius:2px;margin-bottom:3px}
.th.cur{color:var(--accent)}
.th.cur i{border-color:var(--accent)}
.th:hover i{border-color:var(--muted)}
.toc{list-style:none;margin:0;padding:0}
.toc button{display:grid;grid-template-columns:1fr auto;gap:12px;width:100%;text-align:left;border:0;background:none;padding:9px 6px;border-bottom:1px solid var(--line);cursor:pointer;font-size:17px;line-height:1.3;text-wrap:balance}
.toc button:hover{background:var(--raise)}
.toc .pn{color:var(--muted);font-variant-numeric:tabular-nums}
.toc .ch button{font-weight:600}
.sform{display:flex;gap:6px;margin-bottom:12px}
.sform input{flex:1;min-width:0;background:var(--stage);border:1px solid var(--line);color:var(--fg);font:inherit;padding:8px 10px;border-radius:5px}
.sinfo{color:var(--muted);font-size:15px;margin:0 0 8px}
.res{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 6px;border-bottom:1px solid var(--line);cursor:pointer;font-size:16px;line-height:1.35}
.res:hover{background:var(--raise)}
.res b{display:block;color:var(--accent);font-weight:600;font-size:14px;letter-spacing:.05em;text-transform:uppercase;margin-bottom:2px}
.res mark{background:var(--accent);color:var(--stage);padding:0 1px;border-radius:2px}
.share label{display:block;color:var(--muted);font-size:14px;letter-spacing:.06em;text-transform:uppercase;margin:4px 0 6px}
.share textarea,.share input{width:100%;box-sizing:border-box;background:var(--stage);border:1px solid var(--line);color:var(--fg);font:14px/1.4 ui-monospace,Menlo,Consolas,monospace;padding:8px;border-radius:5px;resize:vertical}
.share .row{display:flex;gap:8px;align-items:center;margin:8px 0 22px}
.btn{border:1px solid var(--accent);background:none;color:var(--accent);border-radius:5px;padding:6px 14px;cursor:pointer;font-size:16px}
.btn:hover{background:var(--accent);color:var(--stage)}
.ok{color:var(--muted);font-size:15px}
.chk{display:flex;gap:8px;align-items:center;color:var(--fg);font-size:16px;margin-bottom:12px}

/* zoom */
.zoom{position:absolute;inset:0;z-index:30;background:var(--stage);overflow:hidden;cursor:grab;touch-action:none}
.zoom.drag{cursor:grabbing}
.zc{position:absolute;left:50%;top:50%;display:flex;transform-origin:0 0;will-change:transform}
.zc img{display:block;background:#fff;user-select:none;-webkit-user-drag:none}
.ztools{position:absolute;right:max(14px,env(safe-area-inset-right,0px));top:14px;display:flex;gap:4px;background:var(--bar);border:1px solid var(--line);border-radius:8px;padding:3px;z-index:2}
.zlvl{align-self:center;min-width:52px;text-align:center;font-variant-numeric:tabular-nums;color:var(--muted);font-size:15px}

.toast{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);background:var(--fg);color:var(--stage);padding:7px 14px;border-radius:6px;font-size:16px;z-index:40;pointer-events:none}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:16px;letter-spacing:.08em}

@media (max-width:760px){
  .bookwrap{inset:12px 16px}
  .nav{display:none}
  .title small,.hide-s{display:none}
  .counter{min-width:0}
  .bar{gap:0}
  .ib{width:36px}
}
@media (max-width:420px){ .hide-xs{display:none} }
@media (prefers-reduced-motion:reduce){ .drawer{transition:none} }
</style>

<body>

<div class="app" id="app">
  <header class="bar top">
    <div class="title" id="title">Kochanowski™ – od portretu do marki <small>Katalog</small></div>
    <button class="ib" data-panel="search" title="Szukaj (S)" aria-label="Szukaj"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg></button>
    <button class="ib" data-panel="toc" title="Spis treści" aria-label="Spis treści"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
    <button class="ib" data-panel="thumbs" title="Miniatury (T)" aria-label="Miniatury stron"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5"/><rect x="13.5" y="4" width="6.5" height="6.5"/><rect x="4" y="13.5" width="6.5" height="6.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5"/></svg></button>
    <button class="ib hide-xs" data-panel="share" title="Udostępnij i osadź" aria-label="Udostępnij"><svg viewBox="0 0 24 24"><circle cx="18" cy="5.5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="18.5" r="2.5"/><path d="m8.2 10.8 7.6-4.1M8.2 13.2l7.6 4.1"/></svg></button>
    <a class="ib hide-xs" id="dl" title="Pobierz wersję dostępną (PDF dla czytników ekranu)" aria-label="Pobierz wersję dostępną PDF" target="_blank" rel="noopener" hidden><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/></svg></a>
    <button class="ib" id="fs" title="Pełny ekran (F)" aria-label="Pełny ekran"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </header>

  <main class="stage" id="stage">
    <div class="loading" id="loading">Wczytywanie…</div>
    <div class="bookwrap" id="bookwrap"><div id="book"></div></div>
    <button class="nav prev" id="navPrev" aria-label="Poprzednia strona"><svg viewBox="0 0 24 24"><path d="M15 4 7 12l8 8"/></svg></button>
    <button class="nav next" id="navNext" aria-label="Następna strona"><svg viewBox="0 0 24 24"><path d="m9 4 8 8-8 8"/></svg></button>

    <aside class="drawer" id="drawer" aria-hidden="true">
      <div class="dhead"><h2 id="dtitle">Miniatury</h2><button class="ib" id="dclose" aria-label="Zamknij panel"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
      <div class="dbody" id="dbody">
        <div class="thumbs" id="pThumbs"></div>
        <ul class="toc" id="pToc" hidden></ul>
        <div id="pSearch" hidden>
          <form class="sform" id="sform"><input id="sq" type="search" placeholder="Szukaj w katalogu…" autocomplete="off" aria-label="Szukana fraza"><button class="btn" type="submit">Szukaj</button></form>
          <p class="sinfo" id="sinfo">Wpisz co najmniej 3 znaki. Wielkość liter i polskie znaki nie mają znaczenia.</p>
          <div id="sres"></div>
        </div>
        <div class="share" id="pShare" hidden>
          <label for="shLink">Link do tej strony</label>
          <input id="shLink" readonly>
          <div class="row"><button class="btn" data-copy="shLink">Kopiuj link</button><span class="ok" id="ok1"></span></div>
          <label class="chk"><input type="checkbox" id="shStart" checked> Otwieraj na bieżącej stronie</label>
          <label for="shEmbed">Kod do osadzenia na stronie</label>
          <textarea id="shEmbed" rows="5" readonly></textarea>
          <div class="row"><button class="btn" data-copy="shEmbed">Kopiuj kod</button><span class="ok" id="ok2"></span></div>
        </div>
      </div>
    </aside>

    <div class="zoom" id="zoom" hidden>
      <div class="zc" id="zc"></div>
      <div class="ztools">
        <button class="ib" id="zOut" aria-label="Pomniejsz"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21M7.5 10.5h6"/></svg></button>
        <span class="zlvl" id="zlvl">100%</span>
        <button class="ib" id="zIn" aria-label="Powiększ"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21M7.5 10.5h6M10.5 7.5v6"/></svg></button>
        <button class="ib" id="zClose" aria-label="Zamknij powiększenie"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
    </div>
  </main>

  <footer class="bar bottom">
    <button class="ib hide-s" id="bFirst" title="Początek (Home)" aria-label="Pierwsza strona"><svg viewBox="0 0 24 24"><path d="M6 5v14M18 5l-8 7 8 7"/></svg></button>
    <button class="ib" id="bPrev" title="Poprzednia (←)" aria-label="Poprzednia strona"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="counter" id="counter" title="Przejdź do strony" aria-label="Przejdź do strony"></button>
    <form class="goto" id="gotoForm" hidden><input id="gotoIn" inputmode="numeric" aria-label="Numer strony"><button class="btn" type="submit">OK</button></form>
    <button class="ib" id="bNext" title="Następna (→)" aria-label="Następna strona"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    <button class="ib hide-s" id="bLast" title="Koniec (End)" aria-label="Ostatnia strona"><svg viewBox="0 0 24 24"><path d="M18 5v14M6 5l8 7-8 7"/></svg></button>
    <div class="slider hide-s"><input type="range" id="range" min="0" value="0" aria-label="Pozycja w katalogu"><div class="tip" id="tip" hidden></div></div>
    <span class="sep hide-s"></span>
    <button class="ib" id="bZoom" title="Powiększ (Z lub dwuklik)" aria-label="Powiększ"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21M7.5 10.5h6M10.5 7.5v6"/></svg></button>
    <button class="ib" id="bSound" title="Dźwięk przewracania" aria-label="Dźwięk przewracania" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="w" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg></button>
    <button class="ib hide-xs" id="bPlay" title="Autoodtwarzanie" aria-label="Autoodtwarzanie" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5z"/></svg></button>
  </footer>
  <div class="toast" id="toast" hidden></div>
</div>

<script src="lib/page-flip.browser.js"></script>
<script>
(function(){
"use strict";
/* ===== USTAWIENIA ===== */
var CONFIG = {
  pages: 462,
  pageDir: "md/",        // obrazy stron do widoku książki
  hdDir: "hd/",            // obrazy w wysokiej rozdzielczości do powiększenia
  thumbDir: "thumbs/",
  searchFile: "search.json",
  pdfUrl: "Kochanowski_opracowanie_dostepny.pdf",                    // np. "https://twojadomena.pl/pliki/kochanowski.pdf" – pusty = brak przycisku
  shareUrl: "",                  // adres strony, na której osadzony jest flipbook; pusty = adres samego flipbooka
  flipSeconds: 4                 // tempo autoodtwarzania
};
var F = CONFIG.pages, N = F + 2, PW = 1630, PH = 1559;
/* Sloty książki: okładka, wyklejka, strony 1–460, wyklejka, tył okładki. PDF nie ma wyklejek,
   bez nich strony nieparzyste trafiałyby na lewą stronę rozkładówki. */
function slotFile(s){ return s===0 ? 0 : s===N-1 ? F-1 : (s===1 || s===N-2) ? -1 : s-1; }
function fileSlot(f){ return f<=0 ? 0 : f>=F-1 ? N-1 : f+1; }
var TOC = [
  [0,"Okładka",0],[3,"Strona tytułowa",0],[7,"Spis treści",0],
  [9,"Wstęp",1],[17,"Najstarsze wizerunki poety",1],
  [33,"Wizerunki wzorowane na portretach Piotra Kochanowskiego i Wespazjana Kochowskiego",1],
  [147,"Wizerunek wzorowany na epitafium w Zwoleniu. Popiersia",1],
  [297,"Przedstawienia inspirowane zwoleńskim popiersiem. Sceny historyczne i przedstawienia alegoryczne",1],
  [403,"Ku współczesności",1],[417,"Wykaz skrótów",0],[419,"Bibliografia",0],
  [441,"Wykaz ilustracji",0],[453,"Indeks osób",0],[F-1,"Tył okładki",0]
];
/* Numeracja drukowana: plik PDF nr f+1 (indeks f) to strona drukowana f. */
function lbl(s){ var f = slotFile(s); return s===0 ? "okładka" : s===N-1 ? "tył okładki" : f<0 ? "" : String(f); }
function pad(f){ return ("00"+(f+1)).slice(-3); }

var $ = function(id){ return document.getElementById(id); };
var book = $("book"), pf = null, cur = 0, playing = null, soundOn = false;
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

/* --- strony --- */
var pages = [];
for (var i=0;i<N;i++){
  var d = document.createElement("div");
  d.className = "page";
  if (i<=1 || i>=N-2) d.setAttribute("data-density","hard");
  if (slotFile(i) < 0) d.className += " blank";
  var im = document.createElement("img");
  im.alt = slotFile(i) < 0 ? "" : "Strona " + lbl(i);
  im.decoding = "async";
  d.appendChild(im);
  book.appendChild(d);
  pages.push(im);
}
function loadAround(c){
  for (var j=Math.max(0,c-4); j<=Math.min(N-1,c+7); j++){
    var f = slotFile(j);
    if (f >= 0 && !pages[j].getAttribute("src")) pages[j].src = CONFIG.pageDir + pad(f) + ".webp";
  }
}

function startIndex(){
  var h = location.hash, m = /^#strona-(\d+)$/.exec(h);
  if (m) return fileSlot(Math.min(F-2, Math.max(1, parseInt(m[1],10))));
  if (h === "#tyl-okladki") return N-1;
  return 0;
}

function portraitWanted(){
  var w = $("bookwrap").clientWidth, h = $("bookwrap").clientHeight;
  return w < 520 || (w/h) < 1.22;
}
function applyOrientation(){
  if (!pf) return;
  var s = pf.getSettings();
  /* StPageFlip przechodzi w tryb jednej strony, gdy szerokość < 2 × minWidth */
  s.minWidth = portraitWanted() ? Math.ceil($("bookwrap").clientWidth/2) + 1 : 50;
  book.style.minWidth = "0";
  pf.update();
}

function init(){
  if (typeof St === "undefined" || !St.PageFlip){ $("loading").textContent = "Nie udało się wczytać biblioteki flipbooka."; return; }
  cur = startIndex();
  loadAround(cur);
  pf = new St.PageFlip(book, {
    width: PW/2, height: PH/2, size: "stretch",
    minWidth: 50, maxWidth: 3000, minHeight: 50, maxHeight: 3000,
    showCover: true, usePortrait: true, maxShadowOpacity: 0.45, flippingTime: 750,
    mobileScrollSupport: false, startPage: cur, drawShadow: true, autoSize: true,
    showPageCorners: true, disableFlipByClick: false
  });
  pf.loadFromHTML(document.querySelectorAll("#book .page"));
  applyOrientation();
  $("loading").hidden = true;
  pf.on("flip", function(e){ cur = e.data; onChange(); });
  pf.on("changeOrientation", function(){ onChange(); });
  pf.on("changeState", function(e){ if (e.data === "flipping") flipSound(); });
  window.addEventListener("resize", function(){ requestAnimationFrame(applyOrientation); });
  onChange();
}

function visible(){
  if (!pf) return [cur];
  if (pf.getOrientation() === "portrait") return [cur];
  if (cur === 0) return [0];
  var a = cur % 2 === 1 ? cur : cur-1;
  return a+1 < N ? [a,a+1] : [a];
}
function onChange(){
  if (pf) cur = pf.getCurrentPageIndex();
  loadAround(cur);
  var v = visible();
  var ls = v.map(lbl).filter(Boolean);
  $("counter").innerHTML = ls.join("–") + " <span>/ "+(F-2)+"</span>";
  $("range").value = cur;
  var atStart = v[0] === 0, atEnd = v[v.length-1] === N-1;
  $("bPrev").disabled = $("bFirst").disabled = $("navPrev").disabled = atStart;
  $("bNext").disabled = $("bLast").disabled = $("navNext").disabled = atEnd;
  if (atEnd && playing) togglePlay();
  var h = hashFor(v);
  try { history.replaceState(null, "", location.pathname + location.search + h); } catch(e){}
  markThumb(); fillShare();
}

function go(i, animate){
  i = Math.max(0, Math.min(N-1, i|0));
  if (!pf) return;
  loadAround(i);
  var dist = Math.abs(i - cur);
  if (animate !== false && dist <= 3) pf.flip(i); else { pf.turnToPage(i); cur = i; onChange(); }
}
$("bPrev").onclick = $("navPrev").onclick = function(){ pf && pf.flipPrev(); };
$("bNext").onclick = $("navNext").onclick = function(){ pf && pf.flipNext(); };
$("bFirst").onclick = function(){ go(0,false); };
$("bLast").onclick = function(){ go(N-1,false); };

/* --- suwak --- */
var range = $("range"), tip = $("tip");
range.max = N-1;
range.addEventListener("input", function(){
  tip.hidden = false; tip.textContent = lbl(+range.value) ? "s. " + lbl(+range.value) : "wyklejka";
  var r = range.getBoundingClientRect(), p = range.parentNode.getBoundingClientRect();
  tip.style.left = (r.left - p.left + (+range.value/(N-1))*r.width) + "px";
});
range.addEventListener("change", function(){ tip.hidden = true; go(+range.value, false); });

/* --- przejdź do strony --- */
$("counter").onclick = function(){ $("counter").hidden = true; $("gotoForm").hidden = false; var g=$("gotoIn"); g.value=""; g.placeholder = String(Math.max(1,cur)); g.focus(); };
$("gotoForm").onsubmit = function(e){
  e.preventDefault();
  var v = parseInt($("gotoIn").value,10);
  $("gotoForm").hidden = true; $("counter").hidden = false;
  if (!isNaN(v)) go(v <= 0 ? 0 : fileSlot(Math.min(F-2, v)), false);
};
$("gotoIn").addEventListener("blur", function(){ setTimeout(function(){ $("gotoForm").hidden = true; $("counter").hidden = false; }, 150); });

/* --- panel boczny --- */
var drawer = $("drawer"), panelNow = null;
var PANELS = { thumbs:["pThumbs","Miniatury"], toc:["pToc","Spis treści"], search:["pSearch","Szukaj"], share:["pShare","Udostępnij"] };
function openPanel(name){
  if (panelNow === name){ closePanel(); return; }
  panelNow = name;
  for (var k in PANELS) $(PANELS[k][0]).hidden = (k !== name);
  $("dtitle").textContent = PANELS[name][1];
  drawer.classList.add("open"); drawer.setAttribute("aria-hidden","false");
  document.querySelectorAll("[data-panel]").forEach(function(b){ b.setAttribute("aria-pressed", b.dataset.panel===name ? "true":"false"); });
  if (name === "thumbs"){ buildThumbs(); markThumb(true); }
  if (name === "search"){ loadSearch(); setTimeout(function(){ $("sq").focus(); }, 60); }
  if (name === "share") fillShare();
}
function closePanel(){
  panelNow = null; drawer.classList.remove("open"); drawer.setAttribute("aria-hidden","true");
  document.querySelectorAll("[data-panel]").forEach(function(b){ b.setAttribute("aria-pressed","false"); });
}
document.querySelectorAll("[data-panel]").forEach(function(b){ b.onclick = function(){ openPanel(b.dataset.panel); }; });
$("dclose").onclick = closePanel;
function narrow(){ return window.innerWidth < 760; }

/* miniatury z arkuszy po 50 stron (10 kolumn) */
var thumbsBuilt = false;
function buildThumbs(){
  if (thumbsBuilt) return; thumbsBuilt = true;
  var box = $("pThumbs"), frag = document.createDocumentFragment();
  for (var i=0;i<F;i++){
    var s = Math.floor(i/50), k = i%50, rows = Math.ceil(Math.min(50, F - s*50)/10);
    var col = k%10, row = Math.floor(k/10);
    var b = document.createElement("button"); b.className = "th"; b.dataset.i = fileSlot(i);
    var t = document.createElement("i");
    t.style.backgroundImage = "url(" + CONFIG.thumbDir + "s" + ("0"+s).slice(-2) + ".webp)";
    t.style.backgroundPosition = (col/9*100) + "% " + (rows>1 ? row/(rows-1)*100 : 0) + "%";
    b.appendChild(t); b.appendChild(document.createTextNode(lbl(fileSlot(i))));
    b.setAttribute("aria-label","Strona " + lbl(fileSlot(i)));
    frag.appendChild(b);
  }
  box.appendChild(frag);
  box.addEventListener("click", function(e){
    var b = e.target.closest(".th"); if (!b) return;
    go(+b.dataset.i, false); if (narrow()) closePanel();
  });
}
function markThumb(scroll){
  if (!thumbsBuilt) return;
  var v = visible(), old = document.querySelectorAll(".th.cur");
  old.forEach(function(x){ x.classList.remove("cur"); });
  var first = null;
  v.forEach(function(i){ var el = document.querySelector('.th[data-i="'+i+'"]'); if (el){ el.classList.add("cur"); first = first || el; } });
  if (first && (scroll || panelNow==="thumbs")) first.scrollIntoView({block:"nearest"});
}

/* spis treści */
(function(){
  var ul = $("pToc");
  TOC.forEach(function(t){
    var li = document.createElement("li"); if (t[2]) li.className = "ch";
    var b = document.createElement("button");
    b.innerHTML = "<span></span><span class='pn'></span>";
    b.firstChild.textContent = t[1]; b.lastChild.textContent = (t[0]===0||t[0]===F-1) ? "" : t[0];
    b.onclick = function(){ go(fileSlot(t[0]), false); if (narrow()) closePanel(); };
    li.appendChild(b); ul.appendChild(li);
  });
})();

/* wyszukiwanie */
var TEXT = null, NORM = null, loadingSearch = false;
function fold(s){
  var out = "";
  for (var i=0;i<s.length;i++){
    var c = s[i].toLowerCase();
    if (c === "ł") c = "l";
    else c = c.normalize("NFD").charAt(0);
    out += c;
  }
  return out;
}
function loadSearch(){
  if (TEXT || loadingSearch) return; loadingSearch = true;
  $("sinfo").textContent = "Wczytywanie tekstu katalogu…";
  fetch(CONFIG.searchFile).then(function(r){ if(!r.ok) throw 0; return r.json(); }).then(function(j){
    TEXT = j; NORM = j.map(fold);
    $("sinfo").textContent = "Wpisz co najmniej 3 znaki. Wielkość liter i polskie znaki nie mają znaczenia.";
    if ($("sq").value.trim().length >= 3) doSearch();
  }).catch(function(){ $("sinfo").textContent = "Nie udało się wczytać tekstu do wyszukiwania."; loadingSearch = false; });
}
function esc(s){ return s.replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function doSearch(){
  var q = $("sq").value.trim(), box = $("sres"); box.innerHTML = "";
  if (!TEXT){ loadSearch(); return; }
  if (q.length < 3){ $("sinfo").textContent = "Wpisz co najmniej 3 znaki."; return; }
  var fq = fold(q), hits = 0, pagesHit = 0, frag = document.createDocumentFragment();
  for (var p=0;p<F;p++){
    var n = NORM[p], at = n.indexOf(fq), cnt = 0, first = at;
    while (at > -1){ cnt++; at = n.indexOf(fq, at + fq.length); }
    if (!cnt) continue;
    hits += cnt; pagesHit++;
    if (pagesHit > 150) continue;
    var t = TEXT[p], a = Math.max(0, first-70), z = Math.min(t.length, first+fq.length+90);
    var html = (a>0?"…":"") + esc(t.slice(a, first)) + "<mark>" + esc(t.slice(first, first+fq.length)) + "</mark>" + esc(t.slice(first+fq.length, z)) + (z<t.length?"…":"");
    var b = document.createElement("button"); b.className = "res"; b.dataset.i = fileSlot(p);
    b.innerHTML = "<b>s. " + esc(lbl(fileSlot(p))) + (cnt>1 ? " · " + cnt + " wyst." : "") + "</b>" + html;
    frag.appendChild(b);
  }
  box.appendChild(frag);
  $("sinfo").textContent = pagesHit ? ("Znaleziono " + hits + " wyst. na " + pagesHit + " stronach" + (pagesHit>150 ? " (pokazano 150)." : ".")) : "Brak wyników dla „" + q + "”.";
}
$("sform").onsubmit = function(e){ e.preventDefault(); doSearch(); };
$("sres").addEventListener("click", function(e){ var b = e.target.closest(".res"); if (!b) return; go(+b.dataset.i, false); if (narrow()) closePanel(); });

/* udostępnianie */
function baseUrl(){ return (CONFIG.shareUrl || (location.href.split("#")[0])); }
function hashFor(v){
  var ls = v.map(slotFile).filter(function(f){ return f >= 0; });
  if (!ls.length || ls[0] === 0) return "";
  if (ls[0] === F-1) return "#tyl-okladki";
  return "#strona-" + ls[0];
}
function fillShare(){
  var v = visible(), h = hashFor(v);
  $("shLink").value = baseUrl() + h;
  var src = location.href.split("#")[0] + ($("shStart").checked ? h : "");
  $("shEmbed").value = '<iframe src="' + src + '" title="Kochanowski™ – od portretu do marki. Katalog" style="width:100%;aspect-ratio:16/10;max-height:90vh;border:0" allow="fullscreen; clipboard-write" allowfullscreen loading="lazy"></iframe>';
}
$("shStart").onchange = fillShare;
document.querySelectorAll("[data-copy]").forEach(function(b){
  b.onclick = function(){
    var f = $(b.dataset.copy), ok = b.nextElementSibling;
    function done(msg){ ok.textContent = msg; setTimeout(function(){ ok.textContent=""; }, 2200); }
    try {
      navigator.clipboard.writeText(f.value).then(function(){ done("Skopiowano"); }, function(){ f.select(); done("Zaznaczono – naciśnij Ctrl+C"); });
    } catch(e){ f.select(); done("Zaznaczono – naciśnij Ctrl+C"); }
  };
});

/* pobieranie PDF */
if (CONFIG.pdfUrl){ $("dl").href = CONFIG.pdfUrl; $("dl").hidden = false; }

/* pełny ekran */
var app = $("app");
var fsOK = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
if (!fsOK) $("fs").hidden = true;
$("fs").onclick = function(){
  var el = document.fullscreenElement || document.webkitFullscreenElement;
  try {
    if (el) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else { var r = (app.requestFullscreen || app.webkitRequestFullscreen).call(app); if (r && r.catch) r.catch(function(){ toast("Pełny ekran jest tu niedostępny"); }); }
  } catch(e){ toast("Pełny ekran jest tu niedostępny"); }
};
document.addEventListener("fullscreenchange", function(){ $("fs").setAttribute("aria-pressed", document.fullscreenElement ? "true":"false"); setTimeout(applyOrientation, 80); });

/* dźwięk przewracania (syntetyzowany szelest papieru) */
var actx = null, noise = null;
function flipSound(){
  if (!soundOn) return;
  try {
    if (!actx){ actx = new (window.AudioContext || window.webkitAudioContext)(); }
    if (!noise){
      noise = actx.createBuffer(1, actx.sampleRate*0.6, actx.sampleRate);
      var d = noise.getChannelData(0); for (var i=0;i<d.length;i++) d[i] = (Math.random()*2-1) * (0.6 + 0.4*Math.random());
    }
    var t = actx.currentTime, src = actx.createBufferSource(); src.buffer = noise;
    var bp = actx.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 0.8;
    bp.frequency.setValueAtTime(3200, t); bp.frequency.exponentialRampToValueAtTime(700, t+0.45);
    var g = actx.createGain(); g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.22, t+0.08); g.gain.exponentialRampToValueAtTime(0.05, t+0.3); g.gain.exponentialRampToValueAtTime(0.0001, t+0.55);
    src.connect(bp); bp.connect(g); g.connect(actx.destination); src.start(t); src.stop(t+0.6);
  } catch(e){}
}
function setSound(on){
  soundOn = on; $("bSound").setAttribute("aria-pressed", on ? "true":"false");
  $("bSound").querySelector(".w").style.opacity = on ? 1 : 0.25;
  lsSet("fb-sound", on ? "1":"0");
}
setSound(lsGet("fb-sound") === "1");
$("bSound").onclick = function(){ setSound(!soundOn); if (soundOn){ flipSound(); } };

/* autoodtwarzanie */
function togglePlay(){
  var b = $("bPlay");
  if (playing){ clearInterval(playing); playing = null; b.setAttribute("aria-pressed","false"); b.title = "Autoodtwarzanie"; return; }
  b.setAttribute("aria-pressed","true"); b.title = "Zatrzymaj";
  playing = setInterval(function(){ pf && pf.flipNext(); }, CONFIG.flipSeconds*1000);
}
$("bPlay").onclick = togglePlay;

/* powiększenie */
var Z = { s:1, x:0, y:0, w:0, h:0 }, zoom = $("zoom"), zc = $("zc");
function openZoom(scale, cx, cy){
  var v = visible().filter(function(s){ return slotFile(s) >= 0; }), sw = zoom.parentNode.clientWidth, sh = zoom.parentNode.clientHeight;
  zc.innerHTML = "";
  var ratio = (PW*v.length)/PH, h = Math.min(sh - 40, (sw - 40)/ratio), w = h*ratio;
  Z.w = w; Z.h = h;
  v.forEach(function(i){
    var im = document.createElement("img");
    var f = slotFile(i);
    im.src = CONFIG.pageDir + pad(f) + ".webp";
    if (CONFIG.hdDir && CONFIG.hdDir !== CONFIG.pageDir){ var hi = new Image(); hi.onload = function(){ im.src = hi.src; }; hi.src = CONFIG.hdDir + pad(f) + ".webp"; }
    im.style.width = (w/v.length) + "px"; im.style.height = h + "px"; im.alt = "Strona " + lbl(i);
    zc.appendChild(im);
  });
  zoom.hidden = false; Z.s = 1; Z.x = -w/2; Z.y = -h/2;
  if (playing) togglePlay();
  zoomTo(scale || 2, cx, cy);
}
function clampZ(){
  var sw = zoom.clientWidth, sh = zoom.clientHeight, W = Z.w*Z.s, H = Z.h*Z.s;
  // pozycja lewego górnego rogu względem środka ekranu
  if (W <= sw) Z.x = -W/2; else Z.x = Math.min(-sw/2, Math.max(sw/2 - W, Z.x));
  if (H <= sh) Z.y = -H/2; else Z.y = Math.min(-sh/2, Math.max(sh/2 - H, Z.y));
}
function renderZ(){ clampZ(); zc.style.transform = "translate(" + Z.x + "px," + Z.y + "px) scale(" + Z.s + ")"; $("zlvl").textContent = Math.round(Z.s*100) + "%"; }
function zoomTo(s, cx, cy){
  s = Math.max(1, Math.min(5, s));
  var r = zoom.getBoundingClientRect();
  var px = (cx == null ? r.width/2 : cx - r.left) - r.width/2, py = (cy == null ? r.height/2 : cy - r.top) - r.height/2;
  Z.x = px - (px - Z.x) * (s / Z.s); Z.y = py - (py - Z.y) * (s / Z.s); Z.s = s; renderZ();
}
function closeZoom(){ zoom.hidden = true; zc.innerHTML = ""; }
$("bZoom").onclick = function(){ openZoom(2); };
$("zIn").onclick = function(){ zoomTo(Z.s*1.4); };
$("zOut").onclick = function(){ if (Z.s <= 1.01) closeZoom(); else zoomTo(Z.s/1.4); };
$("zClose").onclick = closeZoom;
$("bookwrap").addEventListener("dblclick", function(e){ openZoom(2.2, e.clientX, e.clientY); });
zoom.addEventListener("wheel", function(e){ e.preventDefault(); zoomTo(Z.s * (e.deltaY < 0 ? 1.15 : 1/1.15), e.clientX, e.clientY); }, {passive:false});
zoom.addEventListener("dblclick", function(e){ if (e.target.closest(".ztools")) return; if (Z.s > 1.5) zoomTo(1, e.clientX, e.clientY); else zoomTo(2.5, e.clientX, e.clientY); });
var ptrs = {}, last = null, pinch = null;
zoom.addEventListener("pointerdown", function(e){
  if (e.target.closest(".ztools")) return;
  zoom.setPointerCapture(e.pointerId); ptrs[e.pointerId] = {x:e.clientX, y:e.clientY};
  var ids = Object.keys(ptrs);
  if (ids.length === 2){ var a = ptrs[ids[0]], b = ptrs[ids[1]]; pinch = { d: Math.hypot(a.x-b.x, a.y-b.y), s: Z.s }; }
  last = {x:e.clientX, y:e.clientY}; zoom.classList.add("drag");
});
zoom.addEventListener("pointermove", function(e){
  if (!ptrs[e.pointerId]) return;
  ptrs[e.pointerId] = {x:e.clientX, y:e.clientY};
  var ids = Object.keys(ptrs);
  if (ids.length === 2 && pinch){
    var a = ptrs[ids[0]], b = ptrs[ids[1]], d = Math.hypot(a.x-b.x, a.y-b.y);
    zoomTo(pinch.s * d / pinch.d, (a.x+b.x)/2, (a.y+b.y)/2); return;
  }
  if (last){ Z.x += e.clientX - last.x; Z.y += e.clientY - last.y; last = {x:e.clientX, y:e.clientY}; renderZ(); }
});
function up(e){ delete ptrs[e.pointerId]; if (Object.keys(ptrs).length < 2) pinch = null; last = null; zoom.classList.remove("drag"); }
zoom.addEventListener("pointerup", up); zoom.addEventListener("pointercancel", up);

/* klawiatura */
document.addEventListener("keydown", function(e){
  var tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea"){ if (e.key === "Escape") e.target.blur(); return; }
  if (!zoom.hidden){
    if (e.key === "Escape") closeZoom();
    else if (e.key === "+" || e.key === "=") zoomTo(Z.s*1.4);
    else if (e.key === "-") { if (Z.s <= 1.01) closeZoom(); else zoomTo(Z.s/1.4); }
    return;
  }
  switch (e.key){
    case "ArrowRight": case "PageDown": pf && pf.flipNext(); e.preventDefault(); break;
    case "ArrowLeft": case "PageUp": pf && pf.flipPrev(); e.preventDefault(); break;
    case "Home": go(0,false); break;
    case "End": go(N-1,false); break;
    case "Escape": closePanel(); break;
    case "f": case "F": $("fs").click(); break;
    case "z": case "Z": case "+": openZoom(2); break;
    case "s": case "S": openPanel("search"); e.preventDefault(); break;
    case "t": case "T": openPanel("thumbs"); break;
  }
});

function toast(msg){ var t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(function(){ t.hidden = true; }, 2200); }

window.addEventListener("hashchange", function(){ var i = startIndex(); if (i !== cur) go(i, false); });
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init); else init();
})();
</script>
